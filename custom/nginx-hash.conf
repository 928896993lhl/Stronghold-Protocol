# v0.2.6 起素材 URL 带内容哈希段：/assets/~<16hex>/... 、/fonts/~<16hex>/... 、/media/~<16hex>/...
# nginx 的 alias 是纯磁盘映射，不认识这个逻辑前缀，会 404；这里 rewrite 掉，让请求落回原有规则。
#
# 注意两点：
#  1) 不能写 ~[0-9a-f]{16} —— nginx 在交给 PCRE 之前就用花括号分块，会报
#     `unknown directive "16}/"`，所以这里放宽成 [0-9a-f]+。
#  2) 这三条必须排在下面的 `location ~ ^/media/(?<m>.+)$` 之前：
#     nginx 对正则 location 按**定义顺序**取第一个匹配，写在后面就永远轮不到。
#     磁盘上不存在 ~xxx 目录，所以放宽匹配不会误伤。

location ~ ^/assets/~[0-9a-f]+/ {
    rewrite ^/assets/~[0-9a-f]+/(.*)$ /assets/$1 last;
}

location ~ ^/fonts/~[0-9a-f]+/ {
    rewrite ^/fonts/~[0-9a-f]+/(.*)$ /fonts/$1 last;
}

location ~ ^/media/~[0-9a-f]+/ {
    rewrite ^/media/~[0-9a-f]+/(.*)$ /media/$1 last;
}
