# stronghold.service 的 systemd drop-in：放宽「同一出口 IP」的上限。
# 安装位置：/etc/systemd/system/stronghold.service.d/addr-limits.conf
# （由 custom/apply-addr-limits.sh 自动放好，改完 systemctl restart stronghold 生效）
#
# 为什么：上游默认是
#   maxConnectionsPerAddr = 64   同一出口 IP 的连接数
#   maxRoomsPerAddr       = 16   同一出口 IP 可建的房间数
#   maxMatchesPerAddr     = 8    同一出口 IP 同时开打的对局数
# 这三个值对公网生效。手机流量走运营商 CGNAT 时，几百个用户可能共享同一个
# 出口 IP —— 人一多就会出现「有些人死活连不上 / 建不了房」，而且很难排查。
# 它们会比 maxRooms=1000 早得多被撞到。
#
# 调大的代价：单个 IP 能开更多连接，抗滥用能力下降。总连接仍有
# maxConnections=2000 兜底，每连接还有 40 msg/s 的限速，可接受。
# 真被刷就往下调，或直接把某一项设成 0（0 = 不限）。
#
# 用 drop-in 而不是改主 unit：主 unit 是部署时手写的，drop-in 独立成文件，
# 想撤销直接删掉再 daemon-reload，官方升级也碰不到它。
[Service]
Environment=SP_MAX_CONNECTIONS_PER_ADDR=512
Environment=SP_MAX_ROOMS_PER_ADDR=64
Environment=SP_MAX_MATCHES_PER_ADDR=32
