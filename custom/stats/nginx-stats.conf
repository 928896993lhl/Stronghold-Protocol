# 看板放在游戏安装目录之外（/opt/stronghold/custom/stats/），
# 所以不会进入 MANIFEST 的校验范围，官方升级覆盖不到它。
#
# 必须 include 在 server_name 之后、其它 location 之前。用 ^~ 是为了压过
# 那条 `location ~ ^/media/(?<m>.+)$` 之类的正则 location —— nginx 先选最长
# 前缀匹配，再去试正则；^~ 让前缀匹配直接胜出。
location ^~ /stats/ {
    alias /opt/stronghold/custom/stats/;
    add_header Cache-Control "no-store" always;

    # alias 会连带整个目录，对外的其实只需要 index.html 和 data/*.ndjson。
    # 采集脚本、nginx 片段、systemd 单元不该被下载 —— 它们会泄露部署路径、
    # 运行用户（User=ubuntu）和本机端口。用嵌套 location 拦掉后缀：
    # 外层是 ^~，同级写正则会被它压掉，所以必须嵌进来。
    location ~ \.(py|conf|sh|service|timer|gitignore)$ { deny all; }

    # 只想自己看的时候，把下面两行的注释去掉并把 IP 换成你的出口地址：
    # allow 203.0.113.1;
    # deny all;
}
