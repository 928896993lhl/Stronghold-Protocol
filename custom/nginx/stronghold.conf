server {
    server_name sp.example.com;
    # v0.2.6 content-hash segment: must stay ABOVE the /media/ regex below, because nginx
    # matches regex locations in definition order.
    include /opt/stronghold/custom/nginx-hash.conf;



    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # Static art (649 MB, ~8000 files) straight from disk: it used to go through the Node process,
    # which read and sent every file itself.
    location /assets/ {
        alias /opt/stronghold/Stronghold-Protocol/public/assets/;
        expires 30d;
        access_log off;
        sendfile on;
        tcp_nopush on;
    }

    # Extension-less audio route (/media/bgm/man_act01 -> assets/audio/bgm/man_act01.mp3), served
    # straight from disk instead of resolution server-side. See server/http/media.js.
    location ~ ^/media/(?<m>.+)$ {
        root /opt/stronghold/Stronghold-Protocol/public/assets/audio;
        try_files /$m.mp3 /$m.ogg =404;
        expires 30d;
        access_log off;
        sendfile on;
        tcp_nopush on;
    }

    # Were it ever needed, a /media/ request the disk cannot answer still reaches Node as before.
    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    listen 443 ssl http2; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/sp.example.com/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/sp.example.com/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = sp.example.com) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    server_name sp.example.com;
    return 404; # managed by Certbot


}
